<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Início</title>
<style>
  /* fonte local: a TV liga antes do Wi-Fi às vezes, e o início não pode depender de rede */
  @font-face { font-family: Outfit; src: url(Outfit.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  header, #title, #dock { animation: rise 700ms cubic-bezier(.2,.8,.2,1) both; }
  #title { animation-delay: 120ms; } #dock { animation-delay: 220ms; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  /* Tizen 6 = Chromium ~76: nada de :has, optional chaining ou container queries */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: Outfit, "Samsung One", sans-serif; }
  /* palco fixo 1920x1080, escalado para a janela real (TV pode reportar 1280x720) */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  #glow { position: absolute; left: 0; top: 0; right: 0; bottom: 0; transition: background 600ms ease; }
  header { position: absolute; left: 140px; top: 70px; }
  .hello { font-size: 26px; letter-spacing: 6px; text-transform: uppercase; opacity: .55; }
  .clock { display: flex; align-items: baseline; gap: 40px; margin-top: 6px; }
  .time { font-size: 150px; font-weight: 200; line-height: 1; }
  .date { font-size: 32px; letter-spacing: 5px; text-transform: uppercase; opacity: .6;
    padding-left: 40px; border-left: 2px solid rgba(255,255,255,.2); }
  #title { position: absolute; left: 150px; top: 430px; font-size: 96px; font-weight: 300; }
  #dock { position: absolute; left: 120px; right: 120px; top: 590px; height: 270px; display: flex; gap: 40px;
    align-items: center; padding: 0 30px; border-radius: 48px;
    background: rgba(30,30,34,.72); border: 2px solid rgba(255,255,255,.08); }
  #grid { position: absolute; left: 150px; right: 150px; top: 895px; display: flex; gap: 40px;
    transition: top 400ms ease; }

  body.down #dock { opacity: .35; }
  .tile { flex: 0 0 auto; width: 380px; height: 214px; border-radius: 32px; display: flex; align-items: center;
    justify-content: center; font-size: 48px; font-weight: 600; letter-spacing: -1px;
    transition: transform 220ms cubic-bezier(.2,.9,.3,1.3), box-shadow 220ms ease; }
  .tile img { max-width: 55%; max-height: 60%; }
  .tile.on { transform: scale(1.12); box-shadow: 0 0 0 5px rgba(255,255,255,.9), 0 30px 60px rgba(0,0,0,.6); }
  #grid .tile { width: 270px; height: 150px; font-size: 34px; }
  #toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 14px 28px;
    border-radius: 999px; background: rgba(255,255,255,.12); font-size: 26px; opacity: 0; transition: opacity 300ms; }
</style>
</head>
<body>
<div id="stage">
<div id="glow"></div>
<header>
  <div class="hello" id="hello"></div>
  <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
</header>
<div id="title"></div>
<div id="dock"></div>
<div id="grid"></div>
<div id="toast"></div>
</div>
<script>
function fit() {
  var s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
fit(); addEventListener('resize', fit);

// IDs medidos na TV (UN50AU7700) em 19/10/2026 via /api/v2/applications/<id>
var DOCK = [
  { id: '3201907018807', name: 'Netflix',     bg: '#000',    fg: '#e50914', glow: '#7a0008' },
  { id: '3201910019365', name: 'Prime Video', bg: '#00a8e1', fg: '#fff',    glow: '#004a66' },
  { id: '3201901017640', name: 'Disney+',     bg: '#0a1a4a', fg: '#fff',    glow: '#0d2a7a' },
  { id: '111299001912',  name: 'YouTube',     bg: '#fff',    fg: '#ff0000', glow: '#6b0000' }
];
var GRID = [
  { id: '3201601007230', name: 'HBO Max',  bg: '#1a0b3d', fg: '#fff', glow: '#3a1a8a' },
  { id: '3201807016597', name: 'Apple TV', bg: '#111',    fg: '#fff', glow: '#333' },
  { id: '3201606009684', name: 'Spotify',  bg: '#1db954', fg: '#000', glow: '#0b5a28' }
];
var rows = [DOCK, GRID], row = 0, col = 0;
var tizenOk = typeof tizen !== 'undefined' && tizen.application;

function tileFor(app) {
  var el = document.createElement('div');
  el.className = 'tile';
  el.style.background = app.bg; el.style.color = app.fg;
  var icon = null;
  if (tizenOk) { try { icon = tizen.application.getAppInfo(app.id).iconPath; } catch (e) {} }
  if (icon) { var img = new Image(); img.src = icon; img.onerror = function () { el.textContent = app.name; }; el.appendChild(img); }
  else el.textContent = app.name;
  app.el = el;
  return el;
}
DOCK.forEach(function (a) { document.getElementById('dock').appendChild(tileFor(a)); });
GRID.forEach(function (a) { document.getElementById('grid').appendChild(tileFor(a)); });

function paint() {
  rows.forEach(function (r) { r.forEach(function (a) { a.el.classList.remove('on'); }); });
  var app = rows[row][col];
  app.el.classList.add('on');
  document.body.className = row ? 'down' : '';
  document.getElementById('title').textContent = app.name;
  document.getElementById('glow').style.background =
    'radial-gradient(ellipse at 30% 45%, ' + app.glow + ' 0%, #000 70%)';
}

function toast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1;
  setTimeout(function () { t.style.opacity = 0; }, 2500);
}

function launch(app) {
  if (!tizenOk) return toast('Abriria ' + app.name + ' (fora da TV)');
  tizen.application.launch(app.id, null, function (e) { toast('Não abriu ' + app.name + ': ' + e.message); });
}

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 37) col = Math.max(0, col - 1);
  else if (k === 39) col = Math.min(rows[row].length - 1, col + 1);
  else if (k === 40 && row === 0) { row = 1; col = Math.min(col, GRID.length - 1); }
  else if ((k === 38 || k === 10009) && row === 1) row = 0;
  else if (k === 13) return launch(rows[row][col]);
  else return;
  e.preventDefault();
  paint();
});

function tick() {
  var d = new Date(), h = d.getHours();
  document.getElementById('hello').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('time').textContent = ('0' + h).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  document.getElementById('date').textContent =
    d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '');
}
tick(); setInterval(tick, 10000); paint();
</script>
</body>
</html>
